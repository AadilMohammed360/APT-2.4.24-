{% load static %}
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container">
        <!-- Contact Info -->
        <div class="row mb-3">
            <div class="col-12 text-center">
                <p class="mb-2">
                    <i class="fa fa-envelope me-2"></i>
                    <a href="mailto:{{ site_content.contact_email }}" class="text-light">
                        {{ site_content.contact_email }}
                    </a>
                </p>
                
                {% if site_content.contact_phone %}
                <p class="mb-2">
                    <i class="fa fa-phone me-2"></i>
                    <a href="tel:{{ site_content.contact_phone }}" class="text-light">
                        {{ site_content.contact_phone }}
                    </a>
                </p>
                {% endif %}
                
                {% if site_content.support_phone %}
                <p class="mb-2">
                    <i class="fa fa-headset me-2 text-warning"></i>
                    <span class="text-warning">Support:</span>
                    <a href="tel:{{ site_content.support_phone }}" class="text-light">
                        {{ site_content.support_phone }}
                    </a>
                </p>
                {% endif %}
            </div>
        </div>
        
        <!-- Footer Text -->
        <div class="row">
            <div class="col-12 text-center">
                <p class="mb-0">{{ site_content.footer_text }}</p>
            </div>
        </div>
    </div>
</footer>
