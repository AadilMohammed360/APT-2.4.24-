{% extends "applicant/apctlayout.html" %}
{% load static %}
{% block header %}
        <!-- Header End -->
        <div class="container-xxl py-5 bg-dark page-header mb-5">
            <div class="container my-5 pt-5 pb-4">
                <h1 class="display-3 text-white mb-3 animated slideInDown">Welcome</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb text-uppercase">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item"><a href="#">Pages</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Welcome</li>
                    </ol>
                </nav>
            </div>
        </div>
        <!-- Header End -->
{% endblock %}
{% block content %}



        <!-- 404 Start -->
        <div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s">
            <div class="container text-center">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <i class="bi bi-briefcase display-1 text-primary"></i>
                        <h1 class="display-1">Welcome {{applicantprofile.applicantname}}</h1>
                        <h2 class="mb-4">You are logged in</h2>
                        <p class="mb-4">
                            Apply for a post
                        </p>
                        <a class="btn btn-primary py-3 px-5 fs-4" href={% url "apctcategory" %}>
                            Find jobs&nbsp;&nbsp;<i class="bi bi-arrow-right-circle"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <!-- 404 End -->
{% endblock %}
