{% extends "applicant/apctlayout.html" %}
{% load static %}
{% block header %}

<!-- Header End -->
<div class="container-xxl py-5 bg-dark page-header mb-5">
    <div class="container my-5 pt-5 pb-4">
        <h1 class="display-3 text-white mb-3 animated slideInDown">Contact</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb text-uppercase">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Pages</a></li>
                <li class="breadcrumb-item text-white active" aria-current="page">Contact</li>
            </ol>
        </nav>
    </div>
</div>
<!-- Header End -->
{% endblock %}
{% block content %}


        <!-- Contact Start -->
        <div class="container-xxl py-5">
            <div class="container">
                <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Update Privacy Here</h1>
                <div class="row g-4">
                    <div class="col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                        <img  alt="" style="height: 75%;" src={% static "img/password.gif" %} >
                    </div>
                    <div class="col-md-6">
                        <div class="wow fadeInUp" data-wow-delay="0.5s">

                            <form method="post" action='{% url "apctprivacy" %}' id="apctpassupdate">
                                {% csrf_token %}

                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="username" name="username" placeholder="Your Name">
                                            <label for="username">Username</label>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-floating">
                                            <input type="password" class="form-control" aria-describedby="pass1-error" id="pass1" name="pass1" placeholder="Old Password">
                                            <label for="pass1">Old Password</label>
                                            <div id="pass1-error"></div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="password" class="form-control" aria-describedby="pass2-error"  id="pass2" name="pass2" placeholder="New Password">
                                            <label for="pass2">New Password</label>
                                            <div id="pass2-error"></div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-12">
                                        <button class="btn btn-primary w-100 py-3" type="submit">Update</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.getElementById('apctpassupdate').addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent default form submission
        
                var form = this;
                var pass1 = document.getElementById('pass1');
                var pass2 = document.getElementById('pass2');
                var password_pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[ !"#$%&'()*+,-./:;<=>?@[\\\]^_`{|}~]).{8,}$/;
                var dbpass = '{{db_pass}}';
                var pass1error = document.getElementById('pass1-error');
                var pass2error = document.getElementById('pass2-error');
        
                if (pass1.value != dbpass) {
                    pass1error.innerHTML = 'Wrong password';
                    pass1error.className = 'invalid-feedback';
                    pass1.className = "form-control is-invalid";
                    return false;
                } else {
                    pass1error.innerHTML = 'Looks Good';
                    pass1error.className = 'valid-feedback';
                    pass1.className = "form-control is-valid";
                }
        
                if (!password_pattern.test(pass2.value)) {
                    pass2error.innerHTML = 'Password must contain at least 8 characters, including uppercase, lowercase, digit, and special character';
                    pass2error.className = 'invalid-feedback';
                    pass2.className = "form-control is-invalid";
                    return false;
                } else {
                    pass2error.innerHTML = 'Looks Good';
                    pass2error.className = 'valid-feedback';
                    pass2.className = "form-control is-valid";
                    form.submit(); // Submit the form if all validations pass
                }
            });
        </script>  
        <!-- Contact End -->
{% endblock %}
