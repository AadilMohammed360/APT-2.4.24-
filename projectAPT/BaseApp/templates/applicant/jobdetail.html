{% extends "applicant/apctlayout.html" %}
{% load static %}

{% block content %}
<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-lg-12">
                <h1 class="mb-3">{{ vdata.vacancyname }}</h1>
                <p class="mb-4"><i class="fa fa-building text-primary me-2"></i><strong>Company:</strong> {{ vdata.company }}</p>
                <p class="mb-4"><i class="fa fa-money text-primary me-2"></i><strong>Salary:</strong> {{ vdata.salary }}</p>
                <p class="mb-4"><i class="fa fa-users text-primary me-2"></i><strong>Seats Available:</strong> {{ vdata.seats }}</p>
                
                <hr class="my-4">
                
                <!-- RENDER ALL CONTENT -->
                <div class="job-content">
                    {{ vdata.content|safe }}
                </div>
                
                <hr class="my-4">
                
                <form method="POST" action="{% url 'applyaction' %}">
                    {% csrf_token %}
                    <input type="hidden" name="vacancy_id" value="{{ vdata.id }}">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fa fa-paper-plane me-2"></i>Apply Now
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
