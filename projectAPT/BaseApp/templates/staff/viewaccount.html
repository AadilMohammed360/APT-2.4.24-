{% extends "staff/stafflayout.html" %}
{% load static %}
{% block content %}
        <!-- Header End -->
        <div class="container-xxl py-5 bg-dark page-header mb-5">
            <div class="container my-5 pt-5 pb-4">
                <h1 class="display-3 text-white mb-3 animated slideInDown">Contact</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb text-uppercase">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item"><a href="#">Pages</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Contact</li>
                    </ol>
                </nav>
            </div>
        </div>
        <!-- Header End -->


        <!-- Contact Start -->
        <div class="container-xxl py-5">
            <div class="container">
                <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Your Account</h1>
                <div class="row g-4 justify-content-center text-center">
                    <div class="col-md-12 wow fadeInUp" data-wow-delay="0.1s">
                        <h2><i class="bi bi-person-circle display-1 "></i></h2>
                    </div>
                    <div class="col-md-6">
                        <div class="wow fadeInUp" data-wow-delay="0.5s">
                            
                            <!-- form with CV Upload -->
                            <form method="post">
                                {% csrf_token %}
                                <div class="row g-3 justify-content-center ">
                                    <div class="col-5 text-end">                                        
                                        <label for="name">Your Name: </label>
                                    </div>
                                    <div class="col-7 text-start">
                                        <span class="ms-5">{{staffprofile.staffname}}</span>
                                    </div>

                                    <div class="col-5 text-end">
                                        <label for="email">Your Email: </label>
                                    </div>
                                    <div class="col-7 text-start">
                                        <span class="ms-5">{{staffprofile.email}}</span>
                                    </div>
                                    <div class="col-5 text-end">
                                        <label for="subject">Your Contact: </label>
                                    </div>
                                    <div class="col-7 text-start">
                                        <span class="ms-5">{{staffprofile.contact}}</span>
                                    </div>
                                    <div class="col-5 text-end">
                                        <label for="subject">Workplace Name: </label>
                                    </div>
                                    <div class="col-7 text-start">
                                        <span class="ms-5">{{staffprofile.workplace}}</span>
                                    </div>
                                    <div class="col-5 text-end">
                                        <label for="subject">Username: </label>
                                    </div>
                                    <div class="col-7 text-start">
                                        <span class="ms-5">{{staffprofile.username}}</span>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Contact End -->
{% endblock %}
