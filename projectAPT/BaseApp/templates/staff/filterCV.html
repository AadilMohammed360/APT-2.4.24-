{% extends "staff/stafflayout.html" %}
{% load static %}
{% block content %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- Carousel Start -->
        <div class="container-fluid p-0">
            <div class="owl-carousel header-carousel position-relative">
                <div class="owl-carousel-item position-relative">
                    <img class="img-fluid" src={% static "img/carousel-1.jpg" %} alt="">
                    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center" style="background: rgba(43, 57, 64, .5);">
                        <div class="">
                            <div class="row justify-content-start">
                                <div class="col-10 col-lg-8">
                                    <h1 class="display-3 text-white animated slideInDown mb-4">Find The Perfect Job That You Deserved</h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="owl-carousel-item position-relative">
                    <img class="img-fluid" src={% static "img/carousel-2.jpg" %} alt="">
                    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center" style="background: rgba(43, 57, 64, .5);">
                        <div class="container">
                            <div class="row justify-content-start">
                                <div class="col-10 col-lg-8">
                                    <h1 class="display-3 text-white animated slideInDown mb-4">Find The Best Startup Job That Fit You</h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Carousel End -->

        
        <!-- Search Start -->
        <div class="container-fluid bg-primary mb-5 wow fadeIn" data-wow-delay="0.1s" style="padding: 35px;">
            <div class="container">
                <!-- form for CV filter -->
                <form action='{% url "stafffilterCV" %}' method="post" id="filterCV">
                    {% csrf_token %}
                    <div class="row g-2">
                        <div class="col-md-10">
                            <div class="row g-2">
                                <div class="col-md-8">
                                    <input type="text" class="form-control border-0" placeholder="Keyword" />
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select border-0" id="filterbasis">
                                        <option selected>Criteria</option>
                                        <option value="1">Qualification</option>
                                        <option value="2">Vacancy</option>
                                    </select>
                                    <script>
                                        filterbasis = document.getElementById('filterbasis');
                                        filterbasis.addEventListener('change', function(){
                                            if(filterbasis.value == 1){
                                                alert("CV will now be filtered on Qualification basis");
                                            }
                                            if(filterbasis.value == 2){
                                                alert("CV will now be filtered based on the vacancy applied for");
                                            }
                                        });
                                    </script>
                                </div>
    
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark border-0 w-100" type="submit">Search</button>
                        </div>
                        <script>
                            form = document.getElementById('filterCV');
                            form.addEventListener('submit', function(event){
                                event.preventDefault();
                                alert("you clicked the submit button");

                            });
                        </script>
                    </div>
                </form>
                <!-- end form  -->
            </div>
        </div>
        <!-- Search End -->
{% endblock %}
